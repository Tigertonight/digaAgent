name: Build and upload DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run ci:release

      - name: Upload release smoke summary
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-summary
          path: dist/release-smoke-summary.json
          if-no-files-found: error

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          dmg="$(find dist -maxdepth 1 -type f -name '*.dmg' | sort | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "No DMG found in dist"
            exit 1
          fi
          cp "$dmg" "dist/Diga.Agent-mac-arm64.dmg"
          gh release upload "$TAG" "dist/Diga.Agent-mac-arm64.dmg" --clobber
