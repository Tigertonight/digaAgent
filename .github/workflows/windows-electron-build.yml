name: Windows Electron build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag ${{ github.ref_name }} does not match package.json version $packageVersion"
          }

      - name: Run tests
        run: npm test -- lib/electron-updater.test.ts

      - name: Build Windows package
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: diga-agent-windows
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Upload Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
